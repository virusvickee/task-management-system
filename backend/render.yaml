services:
  - type: web
    name: task-management-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: CORS_ORIGIN
        sync: false   # set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      # PORT is injected automatically by Render — do not set it here
